name: Release zstreamer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag to release (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release Packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Install Release Build Dependencies
        run: |
          chmod +x scripts/install_deps.sh
          ./scripts/install_deps.sh

      - name: Build and Package
        run: |
          ./scripts/package.sh "${{ env.VERSION }}"

      - name: Verify Release Artifacts
        run: |
          set -euo pipefail
          DEB_VERSION="${VERSION#v}"
          ls -lh dist
          test -f "dist/zstreamer-${VERSION}-linux-x86_64.tar.gz"
          test -f "dist/zstreamer-elements-${VERSION}-linux-x86_64.tar.gz"
          test -f "dist/zstreamer-${VERSION}-linux-x86_64.zip"
          test -f "dist/zstreamer-elements-${VERSION}-linux-x86_64.zip"
          test -f "dist/zstreamer-dev_${DEB_VERSION}_amd64.deb"
          test -f "dist/zstreamer-elements-dev_${DEB_VERSION}_amd64.deb"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: |
            dist/zstreamer-*.tar.gz
            dist/zstreamer-*.zip
            dist/zstreamer-dev_*.deb
            dist/zstreamer-elements-dev_*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
